name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: Version to stamp into the build (without a leading v)
        required: false
        default: '0.1.7'

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.rid }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
            archive: tar.gz
            solver_target: x86_64-unknown-linux-gnu
            solver_archive: tar.gz
          - os: windows-latest
            rid: win-x64
            archive: zip
            solver_target: x86_64-pc-windows-msvc
            solver_archive: zip
          - os: macos-15-intel
            rid: osx-x64
            archive: tar.gz
            solver_target: x86_64-apple-darwin
            solver_archive: tar.gz
          - os: macos-15
            rid: osx-arm64
            archive: tar.gz
            solver_target: aarch64-apple-darwin
            solver_archive: tar.gz

    env:
      RID: ${{ matrix.rid }}
      SOLVER_TARGET: ${{ matrix.solver_target }}
      SOLVER_ARCHIVE: ${{ matrix.solver_archive }}

    steps:
      - name: Check out puzzler-gui
        uses: actions/checkout@v4

      - name: Resolve version
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="${{ github.event.inputs.version }}"
            if [ -z "$VERSION" ]; then VERSION="0.1.7"; fi
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "Building puzzler-gui $VERSION for $RID"

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Download latest puzzler solver
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          mkdir -p solver
          gh release download --repo HFunction2013/puzzler \
            --pattern "puzzler-*-${SOLVER_TARGET}.${SOLVER_ARCHIVE}" \
            --dir solver

          if [ "$SOLVER_ARCHIVE" = "zip" ]; then
            unzip solver/*.zip -d solver
          else
            tar -xzf solver/*.tar.gz -C solver --strip-components=1
          fi

          find solver -maxdepth 2 -type f -name 'puzzler*' -print

      - name: Publish the GUI
        run: >-
          dotnet publish src/PuzzlerGui/PuzzlerGui.csproj
          -c Release
          -r ${{ matrix.rid }}
          --self-contained true
          -p:Version=${{ env.VERSION }}
          -p:DebugType=none
          -p:DebugSymbols=false
          -o publish

      - name: Stage solver and documents
        shell: bash
        run: |
          SOLVER="$(find solver -type f \( -name 'puzzler' -o -name 'puzzler.exe' \) | head -1)"
          test -n "$SOLVER"
          cp "$SOLVER" publish/
          cp README.md LICENSE publish/
          cp src/PuzzlerGui/Assets/puzzler-gui.ico publish/
          cp src/PuzzlerGui/Assets/puzzler-gui.png publish/

          if [ "${{ runner.os }}" = "Linux" ]; then
            mkdir -p publish/linux
            cp packaging/linux/* publish/linux/
            chmod +x publish/linux/install-linux.sh
          fi

          # Keep release archives clean: no debug symbols or XML documentation.
          # The Linux MIME package keeps its required .xml file under linux/.
          find publish -type f \( -name '*.pdb' -o -name '*.xml' \) ! -path '*/linux/*' -delete
          ls -la publish

      - name: Build macOS app bundle
        if: runner.os == 'macOS'
        shell: bash
        run: |
          APP="publish/PuzzlerGui.app/Contents"
          mkdir -p "$APP/MacOS" "$APP/Resources"
          find publish -maxdepth 1 -mindepth 1 ! -name 'PuzzlerGui.app' -exec mv {} "$APP/MacOS/" \;
          sed "s/@VERSION@/$VERSION/g" packaging/macos/Info.plist > "$APP/Info.plist"
          cp src/PuzzlerGui/Assets/puzzler-gui.png "$APP/Resources/"
          chmod +x "$APP/MacOS/PuzzlerGui"
          find publish/PuzzlerGui.app -maxdepth 3 -type f | sort

      - name: Package (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          NAME="puzzler-gui-${VERSION}-${RID}"
          mkdir -p dist
          tar -czf "$PWD/dist/${NAME}.tar.gz" -C publish .
          ls -lh dist

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $name = "puzzler-gui-$env:VERSION-$env:RID"
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          Compress-Archive -Path publish/* -DestinationPath "dist/$name.zip"

          dotnet build installer/PuzzlerGui.Installer.wixproj `
            -c Release `
            -p:Version=$env:VERSION `
            -p:Platform=x64
          $msi = Get-ChildItem installer -Recurse -Filter '*.msi' | Select-Object -First 1
          Copy-Item $msi.FullName "dist/$($msi.Name)"
          Get-ChildItem dist

      - name: Upload archive
        uses: actions/upload-artifact@v4
        with:
          name: puzzler-gui-${{ matrix.rid }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish GitHub release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Download archives
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate checksums
        working-directory: dist
        run: |
          sha256sum *.tar.gz *.zip *.msi > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          name: puzzler-gui ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |
            `puzzler-gui` ${{ github.ref_name }} — a cross-platform desktop
            front-end for the [`puzzler`](https://github.com/HFunction2013/puzzler)
            exact-cover solver.

            Each archive is self-contained: it includes the GUI and the latest
            prebuilt `puzzler` executable from the puzzler release, so no .NET
            runtime or Rust toolchain is needed. Unpack the archive for your
            platform and start `PuzzlerGui` (`PuzzlerGui.exe` on Windows).
            Windows x64 also has an English MSI installer that supports a custom
            install folder, optional shortcuts, opening `.pzle` files from
            Explorer, and launching puzzler-gui after setup by default.
            The macOS archive is a `.app` bundle that declares `.pzle`; the Linux
            archive includes `linux/install-linux.sh` for desktop/MIME
            registration.

            Verify the downloads with `SHA256SUMS.txt` attached below.
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.msi
            dist/SHA256SUMS.txt
